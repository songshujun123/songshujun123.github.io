<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>作品集 · 光伏电站无人机智能巡检解决方案</title>
<style>
  :root{
    --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --accent:#0f6b4f; --accent2:#1a7f63; --soft:#f2f7f5; --bg:#f7f8f8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink); background:var(--bg); margin:0; line-height:1.85; font-size:15px;
  }

  /* ============ 访问码锁屏 ============ */
  #gate{
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(160deg,#0b3d2e 0%,#0f6b4f 55%,#1a7f63 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .gate-card{
    background:#fff; border-radius:14px; padding:36px 30px; max-width:360px; width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.35); text-align:center;
  }
  .gate-card .icon{font-size:34px; margin-bottom:8px;}
  .gate-card h1{font-size:17px; margin:0 0 6px; color:#111;}
  .gate-card p{font-size:12.5px; color:var(--sub); margin:0 0 20px; line-height:1.7;}
  .gate-card input{
    width:100%; padding:11px 14px; font-size:16px; letter-spacing:4px;
    border:1.5px solid var(--line); border-radius:8px; outline:none; text-align:center;
    transition:border-color .2s;
  }
  .gate-card input:focus{border-color:var(--accent);}
  .gate-card button{
    width:100%; margin-top:12px; padding:11px; font-size:15px; font-weight:600;
    background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer;
    transition:background .2s;
  }
  .gate-card button:hover{background:#0c5940;}
  .gate-card button:disabled{opacity:.6; cursor:wait;}
  .gate-err{color:#c0392b; font-size:12.5px; margin-top:10px; min-height:18px;}

  /* ============ 解锁后正文 ============ */
  #app{display:none;}

  /* 顶部导航 */
  nav{
    position:sticky; top:0; z-index:50; background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
  }
  nav .wrap{max-width:880px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:12px;}
  nav .brand{font-weight:700; font-size:13.5px; color:var(--accent); white-space:nowrap; padding:10px 0;}
  nav .links{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; padding:6px 0;}
  nav .links::-webkit-scrollbar{display:none;}
  nav a{font-size:12.5px; color:var(--sub); text-decoration:none; white-space:nowrap; padding:4px 9px; border-radius:14px; transition:all .15s;}
  nav a:hover{color:var(--accent); background:var(--soft);}

  /* 封面区 */
  .hero{
    max-width:880px; margin:0 auto; padding:64px 20px 44px;
  }
  .hero .tag{
    display:inline-block; color:var(--accent); font-size:12.5px; letter-spacing:2px;
    border:1px solid var(--accent); padding:3px 14px; border-radius:20px; margin-bottom:18px;
  }
  .hero h1{font-size:30px; line-height:1.4; margin:0 0 10px; letter-spacing:.5px;}
  .hero .sub{font-size:15px; color:var(--sub); margin:0 0 26px;}
  .hero .meta{border-top:1px solid var(--line); padding-top:18px;}
  .hero .meta p{margin:6px 0; font-size:14px; color:#374151;}
  .hero .meta span{
    display:inline-block; font-size:12px; color:var(--accent); background:var(--soft);
    border-radius:4px; padding:1px 8px; margin-right:10px;
  }

  /* 章节 */
  main{max-width:880px; margin:0 auto; padding:0 20px 70px;}
  section.chapter{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:34px 34px 30px; margin:22px 0;
  }
  h2{
    font-size:20px; margin:0 0 18px; padding-left:12px; line-height:1.5;
    border-left:4px solid var(--accent);
  }
  h3{font-size:15.5px; margin:26px 0 10px;}
  p{margin:9px 0;}
  strong{color:#111;}

  .box{
    background:var(--soft); border:1px solid var(--line); border-left:4px solid var(--accent);
    padding:13px 16px; margin:15px 0; border-radius:6px;
  }
  .box.warn{border-left-color:#b8860b; background:#fbf7ee;}
  .box .t{font-weight:700; color:var(--accent2); margin-bottom:5px; font-size:14px;}
  .box.warn .t{color:#9a6d07;}

  .cols{display:flex; gap:14px; flex-wrap:wrap;}
  .cols .box{flex:1; min-width:240px;}

  table{width:100%; border-collapse:collapse; margin:13px 0; font-size:13.5px; display:block; overflow-x:auto;}
  th,td{border:1px solid var(--line); padding:8px 11px; text-align:left; vertical-align:top; min-width:70px;}
  th{background:var(--soft); font-weight:600; font-size:13px; white-space:nowrap;}
  td strong{white-space:nowrap;}
  .src{color:#8a6d1a; font-size:12px;}

  .spec{display:block; padding:1px 0;}

  figure.fig{margin:18px 0; text-align:center;}
  figure.fig img{max-width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff;}
  figure.fig figcaption{font-size:12.5px; color:var(--sub); margin-top:8px;}

  .steps3{display:flex; gap:10px; margin:14px 0; flex-wrap:wrap;}
  .steps4{display:flex; gap:10px; margin:14px 0; flex-wrap:wrap;}
  .step{flex:1; min-width:200px; border:1px solid var(--line); border-radius:8px; padding:13px 14px; background:#fbfcfc;}
  .step .n{color:var(--accent); font-weight:700; font-size:13.5px; margin-bottom:5px;}
  .step .d{font-size:13px; color:#374151; line-height:1.75;}

  ul,ol{margin:9px 0; padding-left:22px;}
  li{margin:5px 0;}
  ul.tight{margin:5px 0 0;}
  ol.steps-list li{margin:7px 0;}
  ol.ref-list li{margin:8px 0; font-size:13.5px; color:#374151;}

  /* 脚注上标 */
  sup.fnref{
    color:var(--accent2); font-size:11px; cursor:pointer; padding:0 2px;
    border-bottom:1px dashed var(--accent2); user-select:none;
  }
  /* 脚注气泡 */
  #fn-pop{
    position:absolute; z-index:90; max-width:300px; background:#fff; color:#374151;
    border:1px solid var(--line); border-radius:8px; padding:11px 14px;
    font-size:12.5px; line-height:1.7; box-shadow:0 8px 26px rgba(0,0,0,.16);
    display:none;
  }
  #fn-pop .mark{color:var(--accent); font-weight:700; margin-right:5px;}

  .colophon{font-size:12.5px; color:var(--sub); border-top:1px dashed var(--line); padding-top:14px; margin-top:22px;}

  /* 页脚 */
  footer{max-width:880px; margin:0 auto; padding:0 20px 46px; text-align:center;}
  footer p{font-size:12px; color:var(--sub);}

  @media (max-width:640px){
    body{font-size:14.5px;}
    .hero{padding:44px 18px 34px;}
    .hero h1{font-size:24px;}
    section.chapter{padding:24px 20px;}
    h2{font-size:18px;}
  }
</style>
</head>
<body>

<!-- 访问码锁屏 -->
<div id="gate">
  <div class="gate-card">
    <div class="icon">🔒</div>
    <h1>作品集 · 受限访问</h1>
    <p>本作品集仅面向受邀阅示对象开放<br>请输入访问码查看内容</p>
    <input id="code" type="text" inputmode="numeric" autocomplete="off" placeholder="请输入访问码">
    <button id="go" onclick="unlock()">查看作品集</button>
    <div class="gate-err" id="err"></div>
  </div>
</div>

<!-- 解锁后正文 -->
<div id="app">
  <nav>
    <div class="wrap">
      <div class="brand">作品集</div>
      <div class="links">
        <a href="#about">作者说明</a><a href="#ch1">1 背景</a><a href="#ch2">2 标准依据</a><a href="#ch3">3 思路</a><a href="#ch4">4 技术方案</a><a href="#ch5">5 效益</a><a href="#ch6">6 实施</a><a href="#ch7">7 风险</a><a href="#ch8">8 企业能力</a><a href="#ch9">9 参考</a>
      </div>
    </div>
  </nav>

  <!--ENCRYPTED_CONTENT_MOUNT-->

  <footer>
    <p>光伏电站无人机智能巡检解决方案 · 个人求职作品集 · 2026 年 10 月</p>
  </footer>
</div>

function b64ToU8(b64){
  var bin = atob(b64), u8 = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

async function unlock(){
  var code = document.getElementById('code').value.trim();
  var err = document.getElementById('err');
  var btn = document.getElementById('go');
  if(!code){ err.textContent = '请输入访问码'; return; }
  btn.disabled = true; err.textContent = '';
  try{
    var baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']
    );
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64ToU8(DATA.salt), iterations:DATA.iter, hash:'SHA-256' },
      baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']
    );
    var plainBuf = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64ToU8(DATA.iv) }, key, b64ToU8(DATA.ct)
    );
    var html = new TextDecoder().decode(plainBuf);
    document.getElementById('app').innerHTML = html;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    window.scrollTo(0,0);
    bindFnPopups();
  }catch(e){
    err.textContent = '访问码不正确，请重新输入';
  }finally{
    btn.disabled = false;
  }
}
document.getElementById('code').addEventListener('keydown', function(e){
  if(e.key === 'Enter') unlock();
});

// ---- 脚注气泡 ----
function bindFnPopups(){
  var pop = document.getElementById('fn-pop');
  document.querySelectorAll('sup.fnref').forEach(function(s){
    s.addEventListener('click', function(ev){
      ev.stopPropagation();
      var text = s.getAttribute('data-fn');
      var num = s.textContent;
      pop.innerHTML = '<span class="mark">' + num + '</span>' + text;
      pop.style.display = 'block';
      var r = s.getBoundingClientRect();
      var top = r.bottom + window.scrollY + 8;
      var left = Math.min(r.left + window.scrollX, window.scrollX + window.innerWidth - 320);
      pop.style.top = top + 'px';
      pop.style.left = Math.max(window.scrollX + 12, left) + 'px';
    });
  });
  document.addEventListener('click', function(){ pop.style.display = 'none'; });
}
</script>
